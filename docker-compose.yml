services:
  edlics:
    # Full node image (not alpine): includes the toolchain node-pty compiles
    # against — musl/alpine images fail npm install without build-base/python3.
    image: node:22
    container_name: edlics
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - /root/codings:/data
    environment:
      - TZ=Asia/Shanghai
      - CONTAINER_NAME=edlics
    # Terminal is OFF by default; append --terminal only after reading the
    # README「安全说明」section. Auto-generated password: docker logs edlics
    command: >
      sh -c "npx -y edlics-plus serve --hostname 0.0.0.0 --port 5000 --root /data"
