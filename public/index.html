<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edlics</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2389b4fa'/><text x='16' y='23' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='800' font-size='18' fill='%231e1e2e'>Ed</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.3.0/index.min.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/terminal.css">
</head>
<body>
<div class="toolbar">
  <div style="display:flex;align-items:center;gap:4px;margin-right:8px;">
    <span class="logo"><span class="logo-mark">Ed</span>Edlics<a id="appVersion" href="https://github.com/zhaxg/edlics-plus" target="_blank" rel="noopener" title="View on GitHub" style="font-size:11px;font-weight:500;color:var(--text-dimmer);white-space:nowrap;margin-left:2px;text-decoration:none;"></a></span>
    <span id="serverBadge" style="font-size:11px;color:var(--text-dimmer);white-space:nowrap;padding-left:4px;"></span>
    <span style="color:var(--text-dimmer);margin:0 2px;">·</span>
    <span id="themeToggle" title="Toggle theme" style="cursor:pointer;color:var(--text-dimmer);padding:2px;border-radius:4px;user-select:none;transition:color 0.15s;display:flex;align-items:center;" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text-dimmer)'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
  </div>
  <div class="path-bar" id="pathBar"></div>
  <span id="searchScope" title="Toggle global search" style="cursor:pointer;font-size:10px;color:var(--text-dimmer);padding:3px 5px;border-radius:3px;border:1px solid var(--border);user-select:none;white-space:nowrap;transition:color 0.15s;" onclick="this.textContent=this.textContent==='All'?'Cur':'All';document.getElementById('searchBox').focus();">Cur</span>
  <div class="search-box-wrap">
    <input class="search-box" id="searchBox" placeholder="Search files..." />
    <button id="searchBoxClear" class="search-clear hidden" title="Clear"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
</div>
<div class="container">
  <div class="activitybar" id="activitybar">
    <button class="act-btn active" data-view="explorer" title="Explorer (Ctrl+Shift+E)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 2H8.6a1.6 1.6 0 0 0-1.6 1.6v12.8a1.6 1.6 0 0 0 1.6 1.6h9.8a1.6 1.6 0 0 0 1.6-1.6V6.5L15.5 2z"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/><path d="M15 2v5h5"/></svg></button>
    <button class="act-btn" data-view="search" title="Search (Ctrl+Shift+F)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="act-btn" data-view="git" title="Source Control (Ctrl+Shift+G)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg></button>
    <button class="act-btn" data-view="terminal" title="Terminal (Ctrl+`)"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/></svg></button>
    <a class="act-btn act-btn-bottom" href="https://github.com/zhaxg/edlics-plus" target="_blank" rel="noopener" title="GitHub repository"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
  </div>
  <div class="sidebar" id="sidebar">
    <div class="panel" id="panel-explorer">
      <div class="sidebar-header">
        <span>Explorer</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <span id="sudoBadge" style="display:none;font-size:10px;color:var(--yellow);font-weight:600;">sudo</span>
          <button id="btnOpenFolder" title="Open Folder"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
          <button id="btnRefresh" title="Refresh"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"><path stroke-miterlimit="10" d="M18.024 7.043A8.374 8.374 0 0 0 3.74 12.955"/><path stroke-linejoin="round" d="m17.35 2.75l.832 3.372a1.123 1.123 0 0 1-.854 1.382l-3.372.843"/><path stroke-miterlimit="10" d="M5.976 16.957a8.374 8.374 0 0 0 14.285-5.912"/><path stroke-linejoin="round" d="m6.65 21.25l-.832-3.372a1.124 1.124 0 0 1 .855-1.382l3.371-.843"/></g></svg></button>
        </span>
      </div>
      <div class="file-tree" id="fileTree"></div>
    </div>
    <div class="panel hidden" id="panel-search">
      <div class="sidebar-header"><span>Search</span></div>
      <div class="panel-body">
        <div class="search-inputs">
          <div class="search-input-wrap">
            <input id="searchContentInput" placeholder="Search in workspace…" spellcheck="false" />
            <button id="searchContentClear" class="search-clear hidden" title="Clear"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <button id="searchCaseBtn" class="search-toggle" title="Match case">Aa</button>
          <button id="searchRegexBtn" class="search-toggle" title="Regular expression">.*</button>
        </div>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>
    <div class="panel hidden" id="panel-git">
      <div class="sidebar-header">
        <span>Source Control</span>
        <button id="btnGitRefresh" title="Refresh"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"><path stroke-miterlimit="10" d="M18.024 7.043A8.374 8.374 0 0 0 3.74 12.955"/><path stroke-linejoin="round" d="m17.35 2.75l.832 3.372a1.123 1.123 0 0 1-.854 1.382l-3.372.843"/><path stroke-miterlimit="10" d="M5.976 16.957a8.374 8.374 0 0 0 14.285-5.912"/><path stroke-linejoin="round" d="m6.65 21.25l-.832-3.372a1.124 1.124 0 0 1 .855-1.382l3.371-.843"/></g></svg></button>
      </div>
      <div class="panel-body" id="gitPanelBody">
        <div class="panel-placeholder">Git panel — coming next</div>
      </div>
    </div>
  </div>
  <div class="sidebar-resize" id="sidebarResize"></div>
  <div class="main">
    <div class="tabs-bar">
      <div class="tabs" id="tabs"></div>
      <div class="tabs-toggle" id="tabsToggle"></div>
    </div>
    <div class="editor-area" id="editorArea">
      <div class="welcome" id="welcome">
        <div class="key">Ed</div>
        <p id="welcomeText">Select a file to view</p>
        <div class="hint">Press <kbd>Ctrl+P</kbd> to search files</div>
      </div>
    </div>
    <div class="terminal-panel hidden" id="terminalPanel">
      <div class="terminal-resize" id="terminalResize" title="Drag to resize — double-click to reset"></div>
      <div class="terminal-toolbar">
        <span class="terminal-title">Terminal</span>
        <span class="terminal-spacer"></span>
        <button id="terminalKill" title="Kill terminal (restart shell)"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
        <button id="terminalClose" title="Close panel"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div class="terminal-container" id="terminalContainer"></div>
    </div>
  </div>
</div>
<div class="statusbar">
  <span id="statusLeft"></span>
  <span id="statusRight"></span>
</div>
<div class="context-menu hidden" id="contextMenu"></div>
<div class="overlay hidden" id="dialogOverlay">
  <div class="dialog" id="dialogContent"></div>
</div>
<div class="overlay hidden" id="loginOverlay">
  <div class="dialog" style="width:320px;text-align:center;">
    <div style="width:44px;height:44px;background:var(--accent);color:var(--bg);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;margin:0 auto 14px;">Ed</div>
    <h3 style="margin-bottom:6px;">Sign in to Edlics</h3>
    <p style="color:var(--text-dim);font-size:12px;margin-bottom:16px;">Enter the server password to continue</p>
    <input id="loginPassword" type="password" placeholder="Password" autofocus style="width:100%;text-align:center;" />
    <div id="loginError" style="color:var(--red);font-size:12px;min-height:16px;margin-top:8px;"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="primary" id="loginBtn" style="width:100%;">Sign in</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/js/app.mjs"></script>
</body>
</html>
