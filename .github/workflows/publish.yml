name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release (and read the repo)
  id-token: write   # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags so the changelog can diff against the previous tag

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version $VERSION --no-git-tag-version --allow-same-version
          echo "Version set to $VERSION"

      - name: Install dependencies
        run: npm install

      # node-pty's npm tarball ships prebuilds for win/darwin only — Linux
      # needs the install script to fetch/compile one. npm install can exit 0
      # while skipping lifecycle scripts (allow-scripts policy), which yields
      # a green install but a 500 on /api/term/open at test time.
      - name: Ensure node-pty has a Linux binding
        run: |
          if node -e "require('node-pty')" 2>/dev/null; then
            echo "node-pty binding OK"
          else
            echo "node-pty binding missing — building…"
            (cd node_modules/node-pty && node scripts/prebuild.js) \
              || (cd node_modules/node-pty && npx -y node-gyp rebuild)
            node -e "require('node-pty')"
          fi

      - name: Build editor bundle
        run: npm run build

      # Hard gate: nothing below (changelog / npm publish / GitHub Release)
      # runs unless the full unit + integration suite is green.
      - name: Run tests (gate — must pass before publish)
        run: npm test

      - name: Smoke test
        run: |
          test -f public/editor.mjs || { echo "editor.mjs not found"; exit 1; }
          timeout 3 node bin/edlics.js serve --port 19999 || true
          echo "Smoke test passed"

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$GITHUB_REF_NAME" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "$PREV_TAG".."$GITHUB_REF_NAME" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$CHANGELOG" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${GITHUB_REF_NAME}" >> CHANGELOG.md
          cat CHANGELOG.md

      - name: Publish to npm (OIDC)
        run: npm publish --access public --provenance
        # No NODE_AUTH_TOKEN needed — OIDC handles authentication

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
